<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Dash</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e1113;
      color: #e0e0e0;
    }

    .layout {
      display: flex; height: 100vh;
    }

    /* ── Sidebar (desktop) ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: #111518;
      border-right: 1px solid #1e2328;
      display: flex; flex-direction: column;
      padding: 20px 0;
    }

    .sidebar .brand {
      padding: 0 20px 24px;
      font-size: 17px; font-weight: 700;
      letter-spacing: .4px;
      color: #f0f0f0;
      border-bottom: 1px solid #1e2328;
      margin-bottom: 12px;
    }

    .sidebar .brand span {
      background: linear-gradient(135deg, #25dbc8, #6c8cff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px; font-weight: 500;
      color: #8a919a;
      transition: all .15s ease;
      border-left: 3px solid transparent;
      user-select: none;
    }

    .nav-item:hover {
      background: #181c20;
      color: #c0c6ce;
    }

    .nav-item.active {
      background: #161a1e;
      color: #f0f0f0;
      border-left-color: #25dbc8;
    }

    .nav-item svg {
      width: 20px; height: 20px; flex-shrink: 0;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Content area ── */
    .content {
      flex: 1; position: relative; background: #0e1113;
    }

    .content iframe {
      width: 100%; height: 100%; border: none;
      display: block;
    }

    .loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0e1113;
      transition: opacity .25s ease;
    }

    .loader.hidden { opacity: 0; pointer-events: none; }

    .loader .spinner {
      width: 28px; height: 28px;
      border: 3px solid #1e2328;
      border-top-color: #25dbc8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom tab bar (mobile) ── */
    .tab-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 56px;
      background: #111518;
      border-top: 1px solid #1e2328;
      z-index: 100;
    }

    .tab-bar-inner {
      display: flex; height: 100%;
    }

    .tab-item {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: #8a919a;
      font-size: 10px; font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      transition: color .15s ease;
      user-select: none;
    }

    .tab-item.active { color: #25dbc8; }

    .tab-item svg {
      width: 22px; height: 22px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .tab-bar { display: block; }
      .content { height: calc(100vh - 56px); }
      .layout { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar (desktop) -->
    <nav class="sidebar">
      <div class="brand"><span>Master</span> Dash</div>

      <div class="nav-item active" data-tab="bulletin" onclick="switchTab('bulletin')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Bulletin
      </div>

      <div class="nav-item" data-tab="tips" onclick="switchTab('tips')">
        <svg viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Tips
      </div>

      <div class="nav-item" data-tab="budget" onclick="switchTab('budget')">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Budget
      </div>
    </nav>

    <!-- Main content -->
    <div class="content">
      <div class="loader" id="loader"><div class="spinner"></div></div>
      <iframe id="app-frame" title="Application"></iframe>
    </div>
  </div>

  <!-- Bottom tab bar (mobile) -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <div class="tab-item active" data-tab="bulletin" onclick="switchTab('bulletin')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Bulletin
      </div>
      <div class="tab-item" data-tab="tips" onclick="switchTab('tips')">
        <svg viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Tips
      </div>
      <div class="tab-item" data-tab="budget" onclick="switchTab('budget')">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Budget
      </div>
    </div>
  </nav>

  <script>
    const TABS = {
      bulletin: { src: './bulletin/index.html', title: 'Master Dash — Bulletin' },
      tips:     { src: './Test-main/index.html', title: 'Master Dash — Tips' },
      budget:   { src: './Budget-main/app/index.html', title: 'Master Dash — Budget' }
    };

    const frame  = document.getElementById('app-frame');
    const loader = document.getElementById('loader');
    let current  = null;

    function switchTab(tab) {
      if (tab === current) return;
      current = tab;

      // Update nav highlight
      document.querySelectorAll('[data-tab]').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });

      // Show loader, load app
      loader.classList.remove('hidden');
      frame.onload = () => loader.classList.add('hidden');
      frame.src = TABS[tab].src;

      // Update title and persist
      document.title = TABS[tab].title;
      localStorage.setItem('dashboard-active-tab', tab);
    }

    // Restore last tab or default to bulletin
    switchTab(localStorage.getItem('dashboard-active-tab') || 'bulletin');
  </script>
</body>
</html>
